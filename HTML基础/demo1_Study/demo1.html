<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- h 标签是标题标签，共有h1~h6 6级标签，重要性逐级递减，标题标签的字体都是加粗的 -->
    <h1>一级标题</h1>
    <!-- hr标签是添加分割线 -->
    <hr>
    <p>段落标签，独占一行，段落和段落之间有空隙</p>
    <p>这是第二个段落</p>
    <!-- br 标签是换行标签 -->
    <p>最是人间留不住， <br> 朱颜辞镜花辞树。</p>
    <!-- 图片标签img   “src=""，alt=""等”都是标签属性，一个标签可以有多个属性 -->
     <!-- src是位置，alt是图片无法加载出来时显示的文字，title是鼠标悬停时显示的文字，width是宽度height是高度，宽度和高度通常只设置一个另一个会自动匹配。 -->
    <img src="./01.jpg" alt="这是一张图片" title="Hello!This is a picture." width="300">
    <hr>
    <h1>文本格式化标签：b ， u ，i ， s ， strong ， ins ， em ，del </h1>
    <hr>
    <!-- 加粗标签 -->
     <h2>这是加粗标签</h2>
     <b>加粗</b>
     <br>
     <strong>加粗</strong>
     <h3>两种加粗标签效果一样，但在语义上strong标签强调的情感更浓烈</h3>
     <!-- 这是下划线标签 -->
      <h2>这是下划线标签</h2>
      <u>下划线</u>
      <br>
      <ins>下划线</ins>
      <h3>两种下划线标签效果一样，但在语义上ins标签强调的情感更浓烈</h3>
      <!-- 这是斜体标签 -->
       <h2>这是斜体标签</h2>
       <i>斜体</i>
       <br>
       <em>斜体</em>
       <h3>两种斜体标签效果一样，但在语义上em标签强调的情感更浓烈</h3>
       <!-- 这是删除线标签 -->
        <h2>这是删除线标签</h2>
        <s>删除线</s>
        <br>
        <del>删除线</del>
        <h3>两种删除线标签效果一样，但在语义上del标签强调的情感更浓烈</h3>
        <br>
        
</body>
</html>
