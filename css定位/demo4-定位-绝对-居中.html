<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            /* 绝对定位的盒子不能使用margin auto居中 */
            position: absolute;
            /* margin: 0 auto; */

            /* left: 50%;移动到了其参考物的50% */
            left: 50%;
            /* 移动自己盒子宽度的一半 */
            /* margin-left: -150px; */

            /* 位移自己宽高的一半 */
            transform: translate(-50%,-50%);
            top: 50%;
            margin-top: -150px;

            width: 400px;
            height: 300px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
