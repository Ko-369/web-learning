<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .father {
            width: 400px;
            height: 400px;
            background-color: pink;
        }


        .son {
            
            /* position: relative; */

            width: 300px;
            height: 300px;
            background-color: skyblue;
        }

        .sun {
            /* 子级会根据父级去定位，但不在乎父级是相对还是绝对定位 */
            /* 子绝父相 */
            /* 通常父级用相对定位，子级用绝对定位 */
            position: absolute;
            /* left: 20px;
            top: 30px; */

            right: 20px;
            bottom: 50px;

            width: 200px;
            height: 200px;
            background-color: green;
        }
        /* 绝对定位查找父级的方式：就近找定位的父级，如果逐层查找不到这样的父级，就以浏览器窗口为参照进行定位 */
    </style>

</head>
<body>
    <div class="father">
        <div class="son">
            <div class="sun"></div>
        </div>
    </div>
</body>
</html>
