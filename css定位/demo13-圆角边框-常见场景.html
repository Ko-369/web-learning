<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .one {
            width: 200px;
            height: 200px;
            background-color: pink;
            
            /* 设置正圆，盒子必须是正方形 */
            /* 设置正圆，半径取盒子高度的一半 */
            border-radius: 100px;
            /* border-radius最大取50% */
            border-radius: 50%;
        }

        .two {
            width: 300px;
            height: 200px;
            background-color: skyblue;
            border-radius: 100px;
        }
    </style>
</head>
<body>
    <div class="one"></div>

    <div class="two"></div>
</body>
</html>
