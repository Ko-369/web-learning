<body>
    <h1>浪淘沙・北戴河白话翻译</h1>
    <h2>毛泽东</h2>
    <p>
        <br>
        大雨倾泻在幽燕大地，
        <br>
        海上白色巨浪滚滚连天。
        <br>
        秦皇岛外面的那些打鱼小船，
        <br>
        全都淹没在茫茫大海里看不见，
        <br>
        不知道漂向了哪一边。
        <br>
        往事跨越了上千年，
        <br>
        当年魏武帝曹操扬鞭驰骋，
        <br>
        他东登碣石山，写下流传至今的诗篇。
        <br>
        萧瑟秋风如今又吹到这里，
        <br>
        只是人间早已改换，不复当年。
    </p>
    <img src="./浪淘沙·北戴河.png" alt="浪淘沙·北戴河" title="浪淘沙·北戴河">
