<body>
    <p>《浪淘沙・北戴河》白话译文大雨倾泻在幽燕大地，
        海上白色巨浪滚滚连天。
        秦皇岛外面的那些打鱼小船，
        全都淹没在茫茫大海里看不见，
        不知道漂向了哪一边。

        往事跨越了上千年，
        当年魏武帝曹操扬鞭驰骋，
        他东登碣石山，写下流传至今的诗篇。
        萧瑟秋风如今又吹到这里，
        只是人间早已改换，不复当年。
    </p>
