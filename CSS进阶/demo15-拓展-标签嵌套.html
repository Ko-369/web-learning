<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- p和h标题不能相互嵌套 -->
     <p>
        <h1>一级标题</h1>
     </p>

     <!-- p里面不能包含div -->
      <p>
        <div>div</div>
      </p>

      <!-- a标签内部可以嵌套任意元素，但是不能嵌套自己 -->
       
</body>
</html>
