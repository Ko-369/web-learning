    <!-- div 同级 p + -->

     <div>
        <p></p>
     </div>

     <ul>

     <!-- ul里面有3个li ul>li*3 -->
      <ul>

      <!-- ul里面有3个li li里面有文字111 ul>li{111}*3 -->

        <li>111</li>

       </ul>


       <!-- ul里面有3个li li里面文字分别是1,2,3 ul>li{$}*3 -->

            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ul>
