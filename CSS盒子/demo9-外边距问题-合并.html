<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            width: 100px;
            height: 100px;
            background-color: pink;
        }



        /* 外边距折叠现象 */

        /* 场景：垂直布局的跨级元素，上下的margin会合并 */

        /* 结果：最终两者距离为margini的最大值 */
        /* 解决办法：只给其中一个盒子设置margin即可 */

        .one {
            /* margin-bottom: 50px; */
            margin-bottom: 60px;
        }

        .two {
            margin-top: 50px;
        }
    </style>

</head>
<body>
    <div class="one">11</div>
    <div class="two">22</div>
</body>
</html>
