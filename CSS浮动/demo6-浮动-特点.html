<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /* 浮动的标签默认是顶对齐的 */

        /* 浮动:在一行排列,宽高生效--浮动后的标签具备行内块的特点 */

        /* 
            1.浮动元素会脱离标准流（脱标），在标准流中不占位置

            2.浮动元素比标准流高半个级别，可以覆盖标准流中的元素

            3.浮动找浮动，下一个浮动元素会在上一个浮动元素后面左右浮动

            4.浮动元素有特殊的显示效果:
                                    1.一行可以显示多个
                                    2.可以设置宽高
        */


        .one {
            width: 100px;
            height: 100px;
            background-color: pink;

            float: left;
        }

        .two {
            width: 200px;
            height: 200px;
            background-color: skyblue;

            float: left;

            /* 因为有浮动,不能生效 - 盒子无法水平居中 */

            margin: 0 auto;
        }

        .thr {
            width: 300px;
            height: 300px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <div class="one">one</div>
    <div class="two">two</div>
    <div class="thr">thr</div>
</body>
</html>
