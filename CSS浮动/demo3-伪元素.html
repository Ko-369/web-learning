<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .father {
            width: 300px;
            height: 300px;
            background-color: pink;
        }

        .father::before {
            content: "老鼠";
        }

        .father::after {
            content: "大米";
        }
    </style>
</head>
<body>
    <!-- 伪元素 通过css创建标签，装饰性的不重要的小图 -->

    <!-- 找父级，在这个父级里面创建自己标签 -->

    <div class="father">爱</div>

    <!-- 老鼠爱大米 -->
</body>
</html>
