<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .top {

            margin: 0 auto;

            width: 1000px;
            height: 300px;
            background-color: pink;

        }

        .bottom {
            height: 100px;
            background-color: green;
        }

        .left {

            float: left;

            width: 200px;
            /* height: 300px; */
            background-color: #ccc;
        }

        .right {

            float: right;

            width: 790px;
            height: 300px;
            background-color: skyblue;
        }

        .clearfix {
            /* 清除左右两侧浮动的影响 */
            clear:both;
        }

    </style>
</head>
<body>
    <div class="top">
        <!-- 父子级标签, 自己浮动, 父级没有高度, 后面的标准流盒子会受影响,显示到上面的位置 -->
         <!-- 清除浮动的方法:
                            1.给父级加高度
                            2.额外标签法:
                                        步骤:在父元素内容的最后添加一个块级元素,给添加的块级元素设置clear:both
                                        缺点:会在页面中天机额外的标签,让页面的HTML结构变复杂
         -->
        <div class="left"></div>
        <div class="right"></div>
        <div class="clearfix"></div>
    </div>
    <div class="bottom"></div>
</body>
</html>
