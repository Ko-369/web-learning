<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .top {

            margin: 0 auto;

            width: 1000px;
            /* height: 300px; */
            background-color: pink;

        }

        .bottom {
            height: 100px;
            background-color: green;
        }

        .left {

            float: left;

            width: 200px;
            height: 300px;
            background-color: #ccc;
        }

        .right {

            float: right;

            width: 790px;
            height: 300px;
            background-color: skyblue;
        }

        /* 单伪元素清除浮动 和 额外标签法原理是一样的 */
        .clearfix::after {
            /* 伪元素一定要添加content属性 */
            content: '';
            /* 伪元素添加的是行内，单伪元素清除法要求是块 */
            display: block;
            clear: both;

            /* 为了兼容性会添加下面两行代码 */

            height: 0;
            visibility: hidden;
        }

    </style>
</head>
<body>
    <div class="top clearfix">
        <!-- 父子级标签, 自己浮动, 父级没有高度, 后面的标准流盒子会受影响,显示到上面的位置 -->
        <div class="left"></div>
        <div class="right"></div>
    </div>
    <div class="bottom"></div>
</body>
</html>
